name: seal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node packages/verify/seal.mjs
      - run: |
          git config user.name "field-verify"
          git config user.email "field-verify@users.noreply.github.com"
          git add apps/web/public/data/snapshots.json apps/web/protocol.html
          git diff --cached --quiet && exit 0
          git commit -m "Seal letter and allowlist hashes"
          git push
