name: stamp
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node packages/verify/stamp.mjs
      - run: |
          git config user.name "field-verify"
          git config user.email "field-verify@users.noreply.github.com"
          git add apps/web/public/data
          git diff --cached --quiet && exit 0
          git commit -m "Stamp no public source"
          git push
